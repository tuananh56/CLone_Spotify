<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />

    <title>Track | Music</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <script type="module" crossorigin src="/Spotify/assets/track-CNzgrPIk.js"></script>
    <link rel="modulepreload" crossorigin href="/Spotify/assets/router-z-26kj9T.js">
    <link rel="modulepreload" crossorigin href="/Spotify/assets/header-e3N0Gp-V.js">
    <link rel="modulepreload" crossorigin href="/Spotify/assets/player-BtNM4bws.js">
    <link rel="modulepreload" crossorigin href="/Spotify/assets/track-C9qoxsZS.js">
  </head>
  <body class="bg-black min-h-screen text-white antialiased">
    <header
      class="top-0 z-50 sticky flex justify-between items-center bg-neutral-900 shadow-md px-6 py-3"
    >
      <div class="flex items-center space-x-4">
        <i class="text-green-500 text-2xl fa-brands fa-spotify"></i>
        <button
          id="btnGoHome"
          type="button"
          aria-label="Trang chủ"
          class="flex justify-center items-center bg-[#242424] hover:bg-[#333333] rounded-full w-12 h-12 transition"
        >
          <i class="text-lg fa-solid fa-house"></i>
        </button>

        <div class="relative ml-6">
          <div
            class="group flex items-center bg-neutral-800 px-4 py-2 rounded-full hover:ring-2 hover:ring-green-500 w-96 transition-all duration-200"
          >
            <i
              class="mr-2 text-neutral-400 group-hover:text-green-500 fa-solid fa-magnifying-glass"
            ></i>

            <input
              id="searchInput"
              type="text"
              placeholder="Bạn muốn phát nội dung gì?"
              class="bg-transparent focus:outline-none w-full text-neutral-200 text-sm"
            />
          </div>

          <div
            id="searchResults"
            class="hidden top-full z-50 absolute bg-neutral-950 shadow-lg mt-2 rounded-lg w-96 max-h-96 overflow-y-auto"
          ></div>
        </div>
      </div>

      <div
        class="flex items-center space-x-6 font-semibold text-gray-400 text-sm"
      >
        <a href="#" class="hover:text-white transition">Premium</a>
        <a href="#" class="hover:text-white transition">Hỗ trợ</a>
        <a href="#" class="hover:text-white transition">Tải xuống</a>
        <a href="#" class="hover:text-white transition">Cài đặt ứng dụng</a>

        <button
          id="loginBtn"
          type="button"
          class="bg-white hover:bg-gray-200 px-4 py-1 rounded-full text-black"
        >
          Đăng nhập
        </button>

        <button
          id="signupBtn"
          type="button"
          class="hover:text-white transition"
        >
          Đăng ký
        </button>

        <div
          id="userAvatar"
          class="hidden relative flex justify-center items-center bg-purple-400 rounded-full w-8 h-8 font-bold text-black"
        >
          <span id="avatarLetter"></span>
          <div
            class="top-0 right-0 absolute bg-green-500 rounded-full w-2 h-2"
          ></div>
        </div>
      </div>
    </header>

    <div id="page-content" class="p-2 pb-28 min-h-screen">
      <main
        class="bg-gradient-to-b from-neutral-700 via-neutral-800 to-[#121212] rounded-lg min-h-[calc(100vh-16px)] overflow-hidden"
      >
        <div class="mx-auto p-5 md:p-8 max-w-[1500px]">
          <!-- Track Hero -->
          <section
            class="flex sm:flex-row flex-col items-start sm:items-end gap-6 sm:gap-8 mb-8"
          >
            <!-- Cover -->
            <div
              class="w-full sm:w-[200px] md:w-[240px] max-w-[240px] shrink-0"
            >
              <img
                id="trackImageHeader"
                src="..`${import.meta.env.BASE_URL}playlist.png`"
                alt="Track cover"
                class="bg-neutral-800 shadow-2xl shadow-black/40 rounded-md w-full object-cover aspect-square"
              />
            </div>

            <!-- Track Information -->
            <div class="flex-1 min-w-0">
              <p
                class="mb-3 font-bold text-neutral-300 text-xs uppercase tracking-wider"
              >
                Bài hát
              </p>

              <h1
                id="trackTitleHeader"
                class="mb-4 font-extrabold text-3xl sm:text-4xl md:text-5xl lg:text-6xl break-words leading-tight tracking-tight"
              >
                Tên bài hát
              </h1>

              <p
                id="trackArtistHeader"
                class="mb-3 font-semibold text-white text-base break-words"
              >
                Nghệ sĩ
              </p>

              <div
                class="flex flex-wrap items-center gap-x-2 gap-y-1 text-neutral-300 text-sm"
              >
                <span id="trackAlbum">Album</span>

                <span aria-hidden="true" class="text-neutral-500">•</span>

                <span id="trackDuration">Thời lượng</span>
              </div>
            </div>
          </section>

          <!-- Actions -->
          <section class="flex items-center gap-6 mb-10">
            <button
              id="btnPlayTrack"
              type="button"
              aria-label="Phát bài hát"
              class="flex justify-center items-center bg-green-500 hover:bg-green-400 rounded-full focus-visible:outline focus-visible:outline-2 focus-visible:outline-white focus-visible:outline-offset-4 w-14 h-14 text-black text-xl hover:scale-105 transition shrink-0"
            >
              <i class="fa-solid fa-play"></i>
            </button>

            <div class="flex flex-col">
              <span class="font-semibold text-white text-sm">
                Phát bài hát
              </span>
              <span class="mt-1 text-neutral-400 text-xs">
                Nghe ngay bài hát này
              </span>
            </div>
          </section>

          <!-- Player -->
          <section class="pt-6 border-white/10 border-t">
           
              <!-- player.html được tải vào đây -->
            </div>
          </section>
        
      </main>
    </div>
     <div id="player-container" class="min-w-0"></div>
      <div id="footer-container"></div>

  </body>
</html>
