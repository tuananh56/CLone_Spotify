<!-- MUSIC PLAYER -->
<div
  id="player"
  class="bottom-0 left-0 z-50 fixed bg-[#121212]/95 shadow-[0_-10px_40px_rgba(0,0,0,0.35)] backdrop-blur-2xl border-white/10 border-t w-full text-white"
>
  <div
    class="items-center gap-3 sm:gap-5 grid grid-cols-1 sm:grid-cols-[minmax(0,1fr)_minmax(260px,1.4fr)_minmax(0,1fr)] px-3 sm:px-5 lg:px-7 py-3"
  >
    <!-- LEFT: TRACK INFO -->
    <div class="flex items-center gap-3 sm:gap-4 min-w-0">
      <!-- TRACK IMAGE -->
      <img
        id="trackImagePlayer"
        src="/CLone_Spotify/playlist.png"
        alt="Ảnh bài hát"
        class="shadow-lg rounded-lg ring-1 ring-white/10 w-11 sm:w-12 lg:w-14 h-11 sm:h-12 lg:h-14 object-cover shrink-0"
      />

      <!-- TRACK INFO -->
      <div class="flex-1 min-w-0">
        <p
          id="trackTitlePlayer"
          class="font-semibold text-white hover:text-green-400 text-xs sm:text-sm truncate transition-colors"
        >
          Tên bài hát
        </p>

        <p
          id="trackArtistPlayer"
          class="mt-1 text-[10px] text-gray-400 hover:text-white sm:text-xs truncate transition-colors"
        >
          Nghệ sĩ
        </p>
      </div>

      <!-- VOLUME: MOBILE -->
      <div class="sm:hidden flex items-center gap-1.5 shrink-0">
        <button
          id="btnMute"
          type="button"
          title="Tắt tiếng"
          aria-label="Tắt tiếng"
          class="flex justify-center items-center hover:bg-white/10 rounded-full w-8 h-8 text-gray-400 hover:text-white transition shrink-0"
        >
          <i class="text-sm fa-solid fa-volume-high"></i>
        </button>

        <input
          id="volumeControl"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="1"
          aria-label="Âm lượng"
          class="w-12 h-1 accent-green-500 cursor-pointer"
        />
      </div>
    </div>

    <!-- CENTER: PLAYER CONTROLS -->
    <div
      class="flex flex-col sm:justify-self-center items-center gap-2 col-span-1 sm:col-start-2 sm:row-start-1 w-full min-w-0"
    >
      <!-- CONTROL BUTTONS -->
      <div class="flex justify-center items-center gap-5 sm:gap-5 lg:gap-7">
        <button
          id="btnShuffle"
          type="button"
          title="Phát ngẫu nhiên"
          aria-label="Phát ngẫu nhiên"
          class="hidden sm:flex justify-center items-center rounded-full w-8 h-8 text-gray-400 hover:text-green-400 hover:scale-110 transition"
        >
          <i class="text-sm fa-solid fa-shuffle"></i>
        </button>

        <button
          id="btnPrev"
          type="button"
          title="Bài trước"
          aria-label="Bài trước"
          class="flex justify-center items-center rounded-full w-8 h-8 text-gray-400 hover:text-white hover:scale-110 transition"
        >
          <i class="text-lg fa-solid fa-backward-step"></i>
        </button>

        <button
          id="btnPlay"
          type="button"
          title="Phát hoặc tạm dừng"
          aria-label="Phát hoặc tạm dừng"
          class="flex justify-center items-center bg-white hover:bg-green-400 shadow-lg rounded-full w-11 h-11 text-black hover:scale-105 active:scale-95 transition duration-200 shrink-0"
        >
          <i class="text-base pointer-events-none fa-solid fa-play"></i>
        </button>

        <button
          id="btnNext"
          type="button"
          title="Bài tiếp theo"
          aria-label="Bài tiếp theo"
          class="flex justify-center items-center rounded-full w-8 h-8 text-gray-400 hover:text-white hover:scale-110 transition"
        >
          <i class="text-lg fa-solid fa-forward-step"></i>
        </button>

        <button
          id="btnRepeat"
          type="button"
          title="Lặp lại"
          aria-label="Lặp lại"
          class="hidden sm:flex justify-center items-center rounded-full w-8 h-8 text-gray-400 hover:text-green-400 hover:scale-110 transition"
        >
          <i class="text-sm fa-solid fa-repeat"></i>
        </button>
      </div>

      <!-- PROGRESS BAR -->
      <div class="flex items-center gap-2 w-full min-w-0">
        <span
          id="currentTime"
          class="w-8 sm:w-10 tabular-nums text-[10px] text-gray-500 sm:text-xs text-right shrink-0"
        >
          0:00
        </span>

        <input
          id="progressBar"
          type="range"
          min="0"
          max="100"
          step="0.1"
          value="0"
          aria-label="Tiến trình bài hát"
          class="flex-1 bg-white/20 rounded-full min-w-0 h-1 hover:h-1.5 transition-all accent-green-500 appearance-none cursor-pointer"
        />

        <span
          id="totalTime"
          class="w-8 sm:w-10 tabular-nums text-[10px] text-gray-500 sm:text-xs shrink-0"
        >
          0:00
        </span>
      </div>
    </div>

    <!-- RIGHT: VOLUME DESKTOP -->
    <div
      class="hidden sm:flex justify-self-end items-center gap-2 sm:col-start-3 sm:row-start-1"
    >
      <button
        id="btnMuteDesktop"
        type="button"
        title="Tắt tiếng"
        aria-label="Tắt tiếng"
        class="flex justify-center items-center hover:bg-white/10 rounded-full w-8 h-8 text-gray-400 hover:text-white transition shrink-0"
      >
        <i class="text-sm fa-solid fa-volume-high"></i>
      </button>

      <input
        id="volumeControlDesktop"
        type="range"
        min="0"
        max="1"
        step="0.01"
        value="1"
        aria-label="Âm lượng"
        class="w-14 lg:w-20 h-1 accent-green-500 cursor-pointer"
      />
    </div>
  </div>

  <!-- AUDIO -->
  <audio id="audio" preload="metadata"></audio>
</div>
