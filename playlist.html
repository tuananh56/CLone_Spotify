<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playlist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-neutral-900 min-h-screen text-white">
    <main class="p-6 overflow-y-auto">
      <!-- Header Playlist -->
      <section class="flex items-center space-x-6 mb-10">
        <img
          id="detailImage"
          src="/src/assets/placeholder.png"
          alt="Playlist cover"
          class="bg-neutral-800 rounded-lg w-60 h-60 object-cover"
        />
        <div>
          <p class="mb-1 text-gray-400 text-sm uppercase">
            Danh sách phát công khai
          </p>
          <h1 id="detailName" class="mb-2 font-bold text-5xl">Tên playlist</h1>
          <p id="detailDesc" class="mb-3 text-gray-300">Mô tả playlist...</p>
          <p class="text-gray-400 text-sm"></p>

          <!-- Nút hành động -->
          <div class="flex space-x-3 mt-4">
            <button
              id="playBtn"
              class="bg-green-500 hover:bg-green-400 px-5 py-2 rounded-full font-semibold text-black"
            >
              Phát
            </button>
            <button
              id="toggleLibraryBtn"
              class="bg-neutral-700 hover:bg-neutral-600 px-5 py-2 rounded-full font-semibold text-white"
            >
              Lưu vào thư viện
            </button>
            <button
              id="deleteBtn"
              class="hidden bg-red-600 hover:bg-red-500 px-5 py-2 rounded-full font-semibold text-white"
            >
              Xóa
            </button>
          </div>
        </div>
      </section>

      <!-- Danh sách bài hát -->
      <section id="trackList" class="space-y-2 mb-10"></section>

      <!-- Khu vực tìm bài hát -->
      <section class="pt-6 border-neutral-800 border-t">
        <h2 class="mb-3 font-bold text-xl">
          Hãy cùng tìm nội dung cho danh sách phát của bạn
        </h2>
        <input
          type="text"
          placeholder="Tìm bài hát và tập podcast"
          class="bg-neutral-800 px-4 py-3 rounded focus:outline-none w-full text-white"
        />
      </section>
    </main>

    <script type="module" src="/src/playlists/playlist.js"></script>
  </body>
</html>
