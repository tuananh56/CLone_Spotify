<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Album</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.0/dist/tailwind.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-neutral-900 min-h-screen text-white">
    <main class="p-6 overflow-y-auto">
      <!-- Header Album -->
      <section class="flex items-center space-x-6 mb-10">
        <img
          id="detailImage"
          src="/src/assets/placeholder.png"
          alt="Album cover"
          class="bg-neutral-800 rounded-lg w-60 h-60 object-cover"
        />
        <div>
          <p class="mb-1 text-gray-400 text-sm uppercase">Album</p>
          <h1 id="detailName" class="mb-2 font-bold text-5xl">Tên album</h1>
          <p id="detailDesc" class="mb-3 text-gray-300">
            Nghệ sĩ • Năm phát hành
          </p>

          <!-- Nút hành động -->
          <div class="flex space-x-3 mt-4">
            <button
              id="playBtn"
              class="bg-green-500 hover:bg-green-400 px-5 py-2 rounded-full font-semibold text-black"
            >
              Phát
            </button>
            <button
              id="toggleLibraryBtn"
              class="bg-neutral-700 hover:bg-neutral-600 px-5 py-2 rounded-full font-semibold text-white"
            >
              Lưu vào thư viện
            </button>
          </div>
        </div>
      </section>

      <!-- Danh sách bài hát -->
      <section id="trackList" class="space-y-2 mb-10"></section>
    </main>

    <script type="module" src="/src/playlists/album.js"></script>
  </body>
</html>
