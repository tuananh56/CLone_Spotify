<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="player-container"></div>

    <script type="module" src="/src/app/router.js"></script>
    <script type="module" src="/src/player.js"></script>
    <script>
      fetch("/src/player.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("player-container").innerHTML = html;
        });
    </script>
  </body>
</html>
