<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Track</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>
  <body class="bg-neutral-900 min-h-screen text-white">
    <div id="page-content">
      <main class="p-6">
        <!-- Header Track -->
        <section class="flex items-center space-x-6 mb-10">
          <img
            id="trackImageHeader"
            src="/src/assets/playlist.png"
            alt="Track cover"
            class="bg-neutral-800 rounded-lg w-40 h-40 object-cover"
          />
          <div>
            <h1 id="trackTitleHeader" class="mb-2 font-bold text-3xl">
              Tên bài hát
            </h1>
            <p id="trackArtistHeader" class="mb-2 text-gray-300">Nghệ sĩ</p>
            <p id="trackAlbum" class="text-gray-400 text-sm">Album</p>
            <p id="trackDuration" class="text-gray-400 text-sm">Thời lượng</p>

            <div class="flex space-x-3 mt-4">
              <button
                id="btnPlayTrack"
                class="bg-green-500 hover:bg-green-400 px-5 py-2 rounded-full font-semibold text-black"
              >
                Phát
              </button>
            </div>
          </div>
        </section>
        <div id="player-container"></div>
      </main>
    </div>
    <script type="module" src="/src/player.js"></script>

    <script type="module">
      import { initPlayer } from "/src/player.js";
      import { initTrackPage } from "/src/playlists/track.js";

      async function loadPlayer() {
        try {
          const res = await fetch("/player.html");

          if (!res.ok) {
            throw new Error("Không tải được player.html");
          }

          const html = await res.text();

          document.getElementById("player-container").innerHTML = html;

          initPlayer();
          document.dispatchEvent(new Event("playerloaded"));

          const params = new URLSearchParams(window.location.search);
          await initTrackPage(params.get("id"));
        } catch (error) {
          console.error("Lỗi khởi tạo trang Track:", error);
        }
      }

      loadPlayer();
    </script>
  </body>
</html>
