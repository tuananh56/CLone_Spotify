<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Track</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-neutral-900 min-h-screen text-white">
    <main class="p-6">
      <!-- Header Track -->
      <section class="flex items-center space-x-6 mb-10">
        <img
          id="trackImage"
          src="/src/assets/placeholder.png"
          alt="Track cover"
          class="bg-neutral-800 rounded-lg w-40 h-40 object-cover"
        />
        <div>
          <h1 id="trackName" class="mb-2 font-bold text-3xl">Tên bài hát</h1>
          <p id="trackArtist" class="mb-2 text-gray-300">Nghệ sĩ</p>
          <p id="trackAlbum" class="text-gray-400 text-sm">Album</p>
          <p id="trackDuration" class="text-gray-400 text-sm">Thời lượng</p>

          <div class="flex space-x-3 mt-4">
            <button
              id="playBtn"
              class="bg-green-500 hover:bg-green-400 px-5 py-2 rounded-full font-semibold text-black"
            >
              Phát
            </button>
          </div>
        </div>
      </section>
      <div
        id="player"
        class="flex justify-between items-center bg-neutral-900 p-4"
      >
        <!-- Thông tin bài hát -->
        <div class="flex items-center space-x-3">
          <img
            id="trackImage"
            src="/src/assets/placeholder.png"
            class="rounded w-12 h-12"
          />
          <div>
            <p id="trackTitle" class="text-white text-sm">Tên bài hát</p>
            <p id="trackArtist" class="text-gray-400 text-xs">Tên ca sĩ</p>
          </div>
        </div>

        <!-- Điều khiển chính -->
        <div class="flex flex-col items-center space-y-2">
          <div class="flex items-center space-x-4">
            <button id="btnPrev"><i class="fa-solid fa-backward"></i></button>
            <button id="btnPlay"><i class="fa-solid fa-play"></i></button>
            <button id="btnNext"><i class="fa-solid fa-forward"></i></button>
          </div>
          <div class="flex items-center space-x-2 w-96">
            <span id="currentTime" class="text-gray-400 text-xs">0:00</span>
            <input
              id="progressBar"
              type="range"
              min="0"
              max="100"
              value="0"
              class="bg-gray-700 rounded-lg w-full h-1 accent-green-500 appearance-none cursor-pointer"
            />

            <span id="totalTime" class="text-gray-400 text-xs">0:00</span>
          </div>
        </div>

        <!-- Điều khiển phụ -->
        <div class="flex items-center space-x-3">
          <button id="btnRepeat"><i class="fa-solid fa-repeat"></i></button>
          <button id="btnShuffle"><i class="fa-solid fa-shuffle"></i></button>
          <input
            id="volumeControl"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="1"
          />
        </div>
      </div>

      <audio id="audio"></audio>
    </main>
    <script type="module" src="/src/player.js"></script>
    <script type="module" src="/src/playlists/track.js"></script>
  </body>
</html>
