<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121212" />
    <title>Đăng nhập | Spotify Clone</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body class="bg-[#121212] min-h-screen font-sans text-white">
    <!-- Header -->
    <header
      class="flex justify-between items-center px-6 sm:px-12 py-5 border-[#292929] border-b"
    >
      <a href="home.html" class="flex items-center gap-2">
        <i class="text-[#1ed760] text-4xl fa-brands fa-spotify"></i>
        <span class="font-bold text-2xl tracking-tight">Spotify</span>
      </a>

      <div class="flex items-center gap-4">
        <span class="hidden sm:inline text-gray-400 text-sm">
          Chưa có tài khoản?
        </span>
        <a
          href="register.html"
          class="px-5 py-2.5 border border-gray-500 hover:border-white rounded-full font-bold text-sm hover:scale-105 transition"
        >
          Đăng ký
        </a>
      </div>
    </header>

    <!-- Main -->
    <main class="flex justify-center px-4 py-10 sm:py-14">
      <section
        class="bg-[#121212] px-5 sm:px-10 rounded-lg w-full max-w-[450px]"
      >
        <!-- Logo -->
        <div class="mb-8 text-center">
          <i class="text-[#1ed760] text-5xl fa-brands fa-spotify"></i>
          <h1 class="mt-4 font-bold text-3xl sm:text-4xl tracking-tight">
            Đăng nhập Spotify
          </h1>
          <p class="mt-3 text-gray-400 text-sm">
            Tiếp tục nghe những bài hát yêu thích của bạn.
          </p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-5">
          <!-- Email -->
          <div>
            <label for="loginEmail" class="block mb-2 font-bold text-sm">
              Email
            </label>

            <div
              class="flex items-center gap-3 bg-[#121212] px-4 border border-[#727272] hover:border-white rounded-md focus-within:outline focus-within:outline-2 focus-within:outline-white transition"
            >
              <i class="text-gray-400 fa-regular fa-envelope"></i>
              <input
                id="loginEmail"
                name="email"
                type="email"
                placeholder="Nhập email của bạn"
                autocomplete="email"
                required
                class="bg-transparent py-3 outline-none w-full text-white placeholder:text-gray-400 text-sm"
              />
            </div>
          </div>

          <!-- Password -->
          <div>
            <label for="loginPassword" class="block mb-2 font-bold text-sm">
              Mật khẩu
            </label>

            <div
              class="flex items-center gap-3 bg-[#121212] px-4 border border-[#727272] hover:border-white rounded-md focus-within:outline focus-within:outline-2 focus-within:outline-white transition"
            >
              <i class="text-gray-400 fa-solid fa-lock"></i>
              <input
                id="loginPassword"
                name="password"
                type="password"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
                class="bg-transparent py-3 outline-none w-full text-white placeholder:text-gray-400 text-sm"
              />

              <button
                type="button"
                id="toggleLoginPassword"
                tabindex="-1"
                aria-label="Hiện mật khẩu"
                class="text-gray-400 hover:text-white transition shrink-0"
              >
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Forgot password -->
          <div class="text-sm">
            <a
              href="#"
              tabindex="-1"
              class="font-medium text-white hover:text-[#1ed760] underline underline-offset-4 transition"
            >
              Quên mật khẩu?
            </a>
          </div>

          <!-- Submit -->
          <button
            type="submit"
            class="bg-[#1ed760] hover:bg-[#3be477] py-3.5 rounded-full w-full font-bold text-black hover:scale-[1.02] active:scale-[0.99] transition"
          >
            Đăng nhập
          </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-4 my-8">
          <div class="flex-1 bg-[#292929] h-px"></div>
          <span class="text-gray-400 text-xs">HOẶC</span>
          <div class="flex-1 bg-[#292929] h-px"></div>
        </div>

        <!-- Social Login -->
        <div class="space-y-3">
          <button
            type="button"
            class="flex justify-center items-center gap-3 px-4 py-3 border border-[#727272] hover:border-white rounded-full w-full transition"
          >
            <i class="text-lg fa-brands fa-google"></i>
            <span class="font-bold text-sm">Tiếp tục với Google</span>
          </button>

          <button
            type="button"
            class="flex justify-center items-center gap-3 px-4 py-3 border border-[#727272] hover:border-white rounded-full w-full transition"
          >
            <i class="text-xl fa-brands fa-apple"></i>
            <span class="font-bold text-sm">Tiếp tục với Apple</span>
          </button>
        </div>

        <!-- Register -->
        <div class="mt-8 pt-7 border-[#292929] border-t text-sm text-center">
          <span class="text-gray-400">Bạn chưa có tài khoản?</span>
          <a
            href="register.html"
            class="ml-2 font-bold text-white hover:text-[#1ed760] underline underline-offset-4 transition"
          >
            Đăng ký Spotify
          </a>
        </div>
      </section>
    </main>

    <div id="footer-container"></div>
    <!-- Login logic -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
